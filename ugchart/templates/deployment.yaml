apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatbot

spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot

  template:
    metadata:
      labels:
        app: chatbot
    spec:
      containers:
        - name: frontend
          image: chatbot:latest
          imagePullPolicy: IfNotPresent
          ports:
           - containerPort: 5000

